<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashFix | Support Board</title>
  <!-- Bootstrap CSS (needs internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts: Nunito for text, Caveat for the handwritten titles -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Top bar: brand, search, new ticket button -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#f4a6bd" stroke="#4a3f4f" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </span>
      <div>
        <h1 class="brand-title">FlashFix</h1>
        <p class="brand-sub">quick fixes for campus problems</p>
      </div>
    </div>
    <input type="search" id="searchInput" class="search-box" placeholder="Search for a keyword">
    <button type="button" id="newBtn" class="btn btn-main">+ New Ticket</button>
  </header>

  <main class="container-xl py-4">

    <!-- Totals: own pastel bar, each number in a circle with its label below -->
    <section class="row g-3 stats-band mb-4">
      <div class="col-6 col-md-3 stat">
        <span class="stat-number num-total" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="col-6 col-md-3 stat">
        <span class="stat-number num-open" id="openCount">0</span>
        <span class="stat-label">Open</span>
      </div>
      <div class="col-6 col-md-3 stat">
        <span class="stat-number num-progress" id="progressCount">0</span>
        <span class="stat-label">In Progress</span>
      </div>
      <div class="col-6 col-md-3 stat">
        <span class="stat-number num-closed" id="closedCount">0</span>
        <span class="stat-label">Closed</span>
      </div>
    </section>

    <!-- Filter chips -->
    <section class="row g-3 align-items-center mb-3">
      <div class="col-12 col-md-auto filter-group">
        <span class="filter-label">Status</span>
        <div class="chip-group" id="statusChips">
          <button type="button" class="chip active" data-value="All">All</button>
          <button type="button" class="chip" data-value="Open">Open</button>
          <button type="button" class="chip" data-value="In Progress">In Progress</button>
          <button type="button" class="chip" data-value="Closed">Closed</button>
        </div>
      </div>
      <div class="col-12 col-md-auto filter-group">
        <span class="filter-label">Priority</span>
        <div class="chip-group" id="priorityChips">
          <button type="button" class="chip active" data-value="All">All</button>
          <button type="button" class="chip" data-value="Low">Low</button>
          <button type="button" class="chip" data-value="Medium">Medium</button>
          <button type="button" class="chip" data-value="High">High</button>
        </div>
      </div>
      <div class="col-12 col-md text-md-end">
        <span id="ticketCount" class="count-text">0 tickets</span>
      </div>
    </section>

    <!-- Board: one column per status -->
    <section class="row g-3">
      <div class="col-12 col-lg" id="openColumn">
        <div class="column column-open">
          <div class="column-head">
            <h2 class="column-title">Open</h2>
            <span class="column-count" id="openColumnCount">0</span>
          </div>
          <div id="openBody"></div>
        </div>
      </div>

      <div class="col-12 col-lg" id="progressColumn">
        <div class="column column-progress">
          <div class="column-head">
            <h2 class="column-title">In Progress</h2>
            <span class="column-count" id="progressColumnCount">0</span>
          </div>
          <div id="progressBody"></div>
        </div>
      </div>

      <div class="col-12 col-lg" id="closedColumn">
        <div class="column column-closed">
          <div class="column-head">
            <h2 class="column-title">Closed</h2>
            <span class="column-count" id="closedColumnCount">0</span>
          </div>
          <div id="closedBody"></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="page-footer">FlashFix &middot; CS-301 FSWD &middot; Assignment 01</footer>

  <!-- Slide-in drawer with the ticket form -->
  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer" aria-label="Ticket form">
    <div class="drawer-head">
      <h2 class="drawer-title" id="formTitle">New Ticket</h2>
      <button type="button" id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
    </div>

    <form id="ticketForm" novalidate>
      <label for="customer" class="field-label">Customer name</label>
      <input type="text" id="customer" class="line-input" placeholder="e.g. Hamna Raza">
      <p class="hint">3 to 50 characters</p>

      <label for="issue" class="field-label">What is the issue?</label>
      <textarea id="issue" class="line-input" rows="3" placeholder="What went wrong?"></textarea>
      <p class="hint">10 to 300 characters</p>

      <span class="field-label">Priority</span>
      <div class="pill-group">
        <input type="radio" name="priority" id="priorityLow" value="Low">
        <label for="priorityLow" class="pill pill-low">Low</label>
        <input type="radio" name="priority" id="priorityMedium" value="Medium" checked>
        <label for="priorityMedium" class="pill pill-medium">Medium</label>
        <input type="radio" name="priority" id="priorityHigh" value="High">
        <label for="priorityHigh" class="pill pill-high">High</label>
      </div>

      <span class="field-label">Status</span>
      <div class="pill-group">
        <input type="radio" name="status" id="statusOpen" value="Open" checked>
        <label for="statusOpen" class="pill pill-open">Open</label>
        <input type="radio" name="status" id="statusProgress" value="In Progress">
        <label for="statusProgress" class="pill pill-progress">In Progress</label>
        <input type="radio" name="status" id="statusClosed" value="Closed">
        <label for="statusClosed" class="pill pill-closed">Closed</label>
      </div>

      <!-- Validation messages appear here -->
      <div id="formMessage" class="mb-3"></div>

      <div class="drawer-actions">
        <button type="submit" id="submitBtn" class="btn btn-main flex-grow-1">Add Ticket</button>
        <button type="button" id="resetBtn" class="btn btn-soft">Reset</button>
      </div>
    </form>
  </aside>

  <!-- Small message that appears at the bottom -->
  <div id="toast" class="toast-note"></div>

  <!-- type="module" lets us use import / export -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
